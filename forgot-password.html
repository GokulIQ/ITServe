<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - IT Support</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <script>const savedTheme = localStorage.getItem('itSupportTheme'); if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>

</head>
<body class="bg-surface position-relative">
    <header id="site-header" aria-label="Main navigation"></header>
    <main class="d-flex align-items-center min-vh-100 w-100"><div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="glass-card overflow-hidden rounded-4 border-0 shadow-lg p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary display-4 mb-3 d-block"></i>
                        <h4 class="fw-bold text-dark">Reset Password</h4>
                        <p class="text-muted small">Enter your email address to receive a password reset link.</p>
                    </div>
                    
                    <form id="forgotForm" class="needs-validation" novalidate>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">Send Reset Link</button>
                        
                        <div class="text-center">
                            <a href="login.html" class="small text-muted text-decoration-none fw-bold"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </main>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(this.checkValidity()) {
                showToast('Password reset link sent to your email.', 'success');
                this.reset();
                this.classList.remove('was-validated');
            } else {
                this.classList.add('was-validated');
            }
        });
    </script>
    <script src="assets/js/Header.js"></script>
</body>
</html>
